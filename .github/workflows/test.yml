
name: Terraform S3 Deployment

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  terraform:
    runs-on: [self-hosted, amazonlinux, dev]

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Check Terraform
      - name: Check Terraform Version
        run: |
          terraform version

      # 3. Terraform Init
      - name: Terraform Init
        run: |
          terraform init

      # 4. Terraform Format
      - name: Terraform Format
        run: |
          terraform fmt -check

      # 5. Terraform Validate
      - name: Terraform Validate
        run: |
          terraform validate

      # 6. Terraform Plan
      - name: Terraform Plan
        run: |
          terraform plan

      # 7. Terraform Apply 88
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve







